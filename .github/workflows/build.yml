name: CI

on:
  workflow_call:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ssl_version: ${{ steps.get-version.outputs.SSL_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Grab SSL Version
        id: get-version
        run: echo "SSL_VERSION=$(./tools/openssl-version.sh)" >> $GITHUB_OUTPUT

  windows:
    needs: [version]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            arch: amd64
            msvc_arch: amd64

          - runs-on: windows-11-arm
            arch: arm64
            msvc_arch: amd64_arm64

    env:
      SSL_VERSION: ${{ needs.version.outputs.ssl_version }}
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install wget
        run: choco install wget

      - name: Setup perl
        shell: bash
        run: |
          wget https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54021_64bit_UCRT/strawberry-perl-5.40.2.1-64bit-portable.zip
          mkdir strawberry
          cd strawberry
          7z x ../strawberry-perl-5.40.2.1-64bit-portable.zip

          #  I hate microsoft
          PERL_PATH="$PWD/perl"
          echo "PERL_BIN=$PERL_PATH/bin" >> $GITHUB_ENV
          echo "PERL5LIB=$PERL_PATH/vendor/lib;$PERL_PATH/lib" >> $GITHUB_ENV

          ls $PERL_PATH/lib

      - name: Build
        shell: bash
        run: |
          export PATH="$PERL_BIN:$PATH"
          chmod a+x ./windows/build.sh
          ./windows/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/*

  android:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    env:
      SSL_VERSION: ${{ needs.version.outputs.ssl_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          chmod a+x ./android/build.sh
          ./android/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*

  linux:
    needs: [version]
    name: "Linux ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: amd64

          - runs-on: ubuntu-24.04-arm
            arch: aarch64

    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux)
        run: |
          ./unix/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/*

  unix:
    needs: [version]
    name: "${{ matrix.platform }} ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: solaris
            runs-on: ubuntu-latest
            arch: amd64
            vm-arch: x86_64

          - platform: freebsd
            runs-on: ubuntu-latest
            arch: amd64
            vm-arch: x86_64

          - platform: openbsd
            runs-on: ubuntu-latest
            arch: amd64
            vm-arch: x86_64

    env:
      PLATFORM: ${{ matrix.platform }}
      SSL_VERSION: ${{ needs.version.outputs.ssl_version }}
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Disable man-db updates
        run: sudo rm /var/lib/man-db/auto-update

      - name: Build (Solaris)
        if: matrix.platform == 'solaris'
        uses: vmactions/omnios-vm@v1
        with:
          arch: ${{ matrix.vm-arch }}
          release: "r151054"
          usesh: true
          envs: 'PLATFORM ARCH SSL_VERSION GITHUB_WORKSPACE'
          prepare: |
            pkg install wget perl gtar

          run: |
            chmod a+x ./unix/build.sh
            ./unix/build.sh

      - name: Build (FreeBSD)
        if: matrix.platform == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          arch: ${{ matrix.vm-arch }}
          usesh: true
          envs: 'PLATFORM ARCH SSL_VERSION GITHUB_WORKSPACE'
          prepare: |
            pkg install -y wget perl5 bash

          run: |
            chmod a+x ./unix/build.sh
            bash unix/build.sh

      - name: Build (OpenBSD)
        if: matrix.platform == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          arch: ${{ matrix.vm-arch }}
          usesh: true
          envs: 'PLATFORM ARCH SSL_VERSION GITHUB_WORKSPACE'
          prepare: |
            pkg_add bash wget make

          run: |
            chmod a+x ./unix/build.sh
            bash unix/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*