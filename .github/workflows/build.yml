name: CI

on:
  workflow_call:

env:
  TAG: 4.0.1
  COMMIT: b64f68a94e61fa2363c598c75444482b48056697

jobs:
  download:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Download
        run: ./tools/download.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: ${{ env.ARTIFACT }}
          archive: false

      - name: Upload Timestamp
        uses: actions/upload-artifact@v7
        with:
          name: timestamp
          path: TIMESTAMP
          archive: false

      - name: Generate Build Matrix
        id: matrix
        run: echo "matrix=$(./tools/matrix.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: [download]
    name: "${{ matrix.platform }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.download.outputs.matrix) }}

    defaults:
      run:
        shell: >-
          ${{ case(
            matrix.platform == 'windows', 'pwsh',
            matrix.platform == 'mingw', 'msys2 {0}',
            'bash'
          ) }}

    env:
      BASH_SHELL: ${{ matrix.platform == 'mingw' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Setup
      # - name: Setup sccache
      #   uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup perl
        if: matrix.platform == 'windows'
        run: |
          $out = "strawberry-perl-5.42.2.1-64bit-portable.zip"
          $repo = "StrawberryPerl/Perl-Dist-Strawberry"
          $tag = "SP_54221_64bit"

          curl -LO "https://github.com/$repo/releases/download/$tag/$out"
          mkdir strawberry
          cd strawberry
          7z x ..\$out

      - name: Setup MSYS2
        if: matrix.platform == 'mingw'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'amd64' && 'ucrt64' || 'clangarm64' }}
          update: true
          install: >-
            git make tar curl
          pacboy: >-
            toolchain:p

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: crueter/setup-msvc-dev@master

      - name: Setup Environment
        shell: bash
        run: |
          . tools/vars.sh
          {
            echo "DIRECTORY=$DIRECTORY"
            echo "ARTIFACT=$ARTIFACT"
            echo "OUT_DIR=$GITHUB_WORKSPACE/out"

            echo "ARCH=${{ matrix.arch }}"
            echo "PLATFORM=${{ matrix.platform }}"
          } >> "$GITHUB_ENV"

          mkdir -p out

      # Download + extract
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}

      - name: Download Timestamp
        uses: actions/download-artifact@v8
        with:
          name: TIMESTAMP

      - name: Disable Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableArchiveScanning $true

      - name: Extract
        run: tar xf ${{ env.ARTIFACT}}

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/strawberry/perl/bin:$PATH"
          ./tools/configure.sh

      - name: Configure (UNIX)
        if: matrix.platform != 'windows'
        run: ./tools/configure.sh

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          $env:CL = " /MP /DEBUG:NONE"

          cd $env:DIRECTORY

          nmake depend
          nmake
          nmake install DESTDIR=$env:OUT_DIR

      - name: Build (UNIX)
        if: matrix.platform != 'windows'
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            . tools/common.sh
            android_paths
          fi

          cd $DIRECTORY

          make depend
          make -j4
          make install DESTDIR=$OUT_DIR

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: ./tools/package.sh

      - name: Package (UNIX)
        if: matrix.platform != 'windows'
        run: ./tools/package.sh

      - name: Upload Tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*.tar.zst
          archive: false

      - name: Upload Sum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-sha512sum
          path: artifacts/*.tar.zst.sha512sum
          archive: false