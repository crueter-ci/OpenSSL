name: Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Get Version
        run: |
          . ./tools/vars.sh
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          ./tools/changelog.sh > changelog.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ./changelog.md
          name: OpenSSL ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          files: |
            *.tar.zst*

          make_latest: true
